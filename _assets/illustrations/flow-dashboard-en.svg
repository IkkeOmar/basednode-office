<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Schematic of numbers from several systems being collected, queried in plain language and answered on one screen">
  <style>
    .ink { stroke: #211F1B; }
    .muted { stroke: #6F6A60; }
    .accent { stroke: #F26B1F; }
    .thin { stroke-width: 0.75; }
    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
    .accent-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #A8410C; stroke: none; font-weight: 600; }

    /* --------------------------------------------------------------
       MOTION

       The flow drawing was a still blueprint: it showed what the system
       does, but not that it DOES anything. The diagram now runs.

       The drawing is loaded as an IMG tag, so it cannot be scripted from
       the page — but CSS animations inside an SVG document run regardless,
       because the SVG is its own document. Verified: a circle in an
       img-referenced SVG scales as expected.

       NOTE: no angle brackets may appear in this comment. The SVG is
       parsed as XML, and a stray "&lt;" inside the style block makes the
       whole document fail to parse — the browser then renders an empty
       box with no error, which is very hard to spot by eye.

       The sequence reads as one event:
         1. the panels fade up in order, like a plotter drawing the sheet
         2. the connectors draw themselves between them
         3. a packet of data travels down the chain, connector by
            connector, and the nodes light up as it passes
       After the intro the packet keeps looping, so the drawing never
       looks frozen.

       --i and --c are per-element indices set inline, so the stagger
       comes from the generator rather than from hand-written delays.
       -------------------------------------------------------------- */
    .flow-panel {
      opacity: 0;
      animation: bn-flow-panel 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(var(--i) * 0.16s);
    }
    @keyframes bn-flow-panel {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: none; }
    }

    .flow-wire {
      stroke-dasharray: 90;
      stroke-dashoffset: 90;
      animation: bn-flow-draw 0.45s ease-out both;
      animation-delay: calc(var(--c) * 0.16s + 0.12s);
    }
    @keyframes bn-flow-draw { to { stroke-dashoffset: 0; } }

    /* The packet. It travels the length of its own connector, so each
       one is a separate element with its own distance. */
    .flow-packet {
      opacity: 0;
      animation: bn-flow-packet 1.9s cubic-bezier(0.55, 0, 0.45, 1) infinite;
      animation-delay: calc(var(--c) * 0.16s + 0.5s);
    }
    @keyframes bn-flow-packet {
      0%   { opacity: 0; transform: translateX(0); }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(var(--dist)); }
    }

    /* The node the packet is heading for. */
    .flow-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: bn-flow-node 1.9s ease-in-out infinite;
      animation-delay: calc(var(--c) * 0.16s + 0.5s);
    }
    @keyframes bn-flow-node {
      0%, 78%, 100% { transform: scale(1); opacity: 0.55; }
      18%           { transform: scale(1.35); opacity: 1; }
    }

    /* The confirmed result at the end of the ledger panel. */
    .flow-ok {
      animation: bn-flow-ok 1.9s ease-in-out infinite;
      animation-delay: calc(var(--c) * 0.16s + 1.25s);
    }
    @keyframes bn-flow-ok {
      0%, 70%, 100% { opacity: 0.55; }
      82%           { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-panel { opacity: 1; animation: none; transform: none; }
      .flow-wire  { stroke-dashoffset: 0; animation: none; }
      .flow-packet { display: none; }
      .flow-node, .flow-ok { animation: none; opacity: 1; }
    }
  </style>
  <!-- BLUEPRINT FRAME -->
    <rect class="ink thin" x="20" y="20" width="600" height="440" rx="0" />
  <!-- CORNER TICK MARKS -->
  <g class="ink thin">
    <line class="ink thin" x1="20" y1="40" x2="30" y2="40" />
    <line class="ink thin" x1="20" y1="60" x2="30" y2="60" />
    <line class="ink thin" x1="20" y1="80" x2="30" y2="80" />
    <line class="ink thin" x1="40" y1="20" x2="40" y2="30" />
    <line class="ink thin" x1="60" y1="20" x2="60" y2="30" />
    <line class="ink thin" x1="80" y1="20" x2="80" y2="30" />
    <line class="ink thin" x1="610" y1="40" x2="620" y2="40" />
    <line class="ink thin" x1="610" y1="60" x2="620" y2="60" />
    <line class="ink thin" x1="610" y1="80" x2="620" y2="80" />
    <line class="ink thin" x1="540" y1="20" x2="540" y2="30" />
    <line class="ink thin" x1="560" y1="20" x2="560" y2="30" />
    <line class="ink thin" x1="580" y1="20" x2="580" y2="30" />
  </g>
  <g transform="translate(420, 380)">
    <rect class="ink thin" x="0" y="0" width="180" height="60" rx="0" />
    <line class="ink hair" x1="0" y1="20" x2="180" y2="20" />
    <line class="ink hair" x1="0" y1="40" x2="180" y2="40" />
    <line class="ink hair" x1="100" y1="0" x2="100" y2="60" />
    <text class="muted-text" x="6" y="14" font-size="9">FIG.</text>
    <text class="ink-text" x="106" y="14" font-size="10" font-weight="500">03 / 03</text>
    <text class="muted-text" x="6" y="34" font-size="9">DRAWN BY</text>
    <text class="ink-text" x="106" y="34" font-size="10">BASEDNODE</text>
    <text class="muted-text" x="6" y="54" font-size="9">SCALE</text>
    <text class="ink-text" x="106" y="54" font-size="10">1 : 4</text>
  </g>
  <!-- STEP 1 -->
  <g transform="translate(61.0, 100.0)">
  <g class="flow-panel" style="--i:0">
    <rect class="ink" x="0" y="0" width="130" height="130" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="130" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">NUMBERS</text>
    <text class="ink-text" x="122" y="18" font-size="8" text-anchor="end" font-weight="500">+18 %</text>
    <rect class="muted hair" x="12.0" y="90" width="18.5" height="26" rx="1" />
    <text class="muted-text" x="21.25" y="126" font-size="6" text-anchor="middle">Q1</text>
    <rect class="muted hair" x="38.5" y="75" width="18.5" height="41" rx="1" />
    <text class="muted-text" x="47.75" y="126" font-size="6" text-anchor="middle">Q2</text>
    <rect class="muted hair" x="65.0" y="57" width="18.5" height="59" rx="1" />
    <text class="muted-text" x="74.25" y="126" font-size="6" text-anchor="middle">Q3</text>
    <rect class="muted hair" x="91.5" y="40" width="18.5" height="76" rx="1" />
    <text class="muted-text" x="100.75" y="126" font-size="6" text-anchor="middle">Q4</text>
  </g>
  </g>
  <!-- STEP 2 -->
  <g transform="translate(277.0, 105.0)">
  <g class="flow-panel" style="--i:1">
    <rect class="ink" x="0" y="0" width="136" height="120" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="136" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">QUESTION</text>
    <text class="accent-text" x="128" y="18" font-size="8" text-anchor="end">WHY?</text>
    <line class="muted hair" x1="8" y1="44" x2="128" y2="44" />
    <line class="muted hair" x1="8" y1="58" x2="110" y2="58" />
    <line class="muted hair" x1="8" y1="72" x2="128" y2="72" />
    <line class="accent thin" x1="8" y1="94" x2="106" y2="94" />
  </g>
  </g>
  <!-- STEP 3 -->
  <g transform="translate(499.0, 105.0)">
  <g class="flow-panel" style="--i:2">
    <rect class="ink" x="0" y="0" width="100" height="120" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="100" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">ANSWER</text>
    <line class="muted hair" x1="8" y1="42" x2="92" y2="42" />
    <line class="muted hair" x1="8" y1="56" x2="92" y2="56" />
    <line class="muted hair" x1="8" y1="70" x2="92" y2="70" />
    <text class="flow-ok" style="--c:2" x="92" y="104" font-size="9" text-anchor="end" font-weight="500" fill="#211F1B" stroke="none">9 SEC</text>
  </g>
  </g>
  <!-- CONNECTOR 1 -->
    <line class="ink thin flow-wire" style="--c:0" x1="197.0" y1="165" x2="269.0" y2="165" />
    <circle class="flow-node" style="--c:0" cx="233.0" cy="165" r="4" fill="#F26B1F" />
    <circle class="flow-packet" style="--c:0;--dist:72.0px" cx="197.0" cy="165" r="2.5" fill="#F26B1F" />
  <!-- CONNECTOR 2 -->
    <line class="ink thin flow-wire" style="--c:1" x1="419.0" y1="165" x2="491.0" y2="165" />
    <circle class="flow-node" style="--c:1" cx="455.0" cy="165" r="4" fill="#F26B1F" />
    <circle class="flow-packet" style="--c:1;--dist:72.0px" cx="419.0" cy="165" r="2.5" fill="#F26B1F" />
    <text class="ink-text" x="61.0" y="88.0" font-size="8">01 · COLLECTED</text>
    <text class="ink-text" x="277.0" y="93.0" font-size="8">02 · ASKED</text>
    <text class="ink-text" x="499.0" y="93.0" font-size="8">03 · ANSWERED</text>
  <!-- CALLOUT -->
  <g>
    <line class="accent thin" x1="233.0" y1="165" x2="233.0" y2="248" />
    <circle class="accent" cx="233.0" cy="165" r="2.5" fill="#F26B1F" />
    <g transform="translate(160, 252)">
    <rect class="ink thin" x="0" y="0" width="150" height="46" rx="0" />
    <line class="ink hair" x1="0" y1="16" x2="150" y2="16" />
    <text class="muted-text" x="6" y="12" font-size="7">DETAIL · C</text>
    <text class="accent-text" x="6" y="30" font-size="8">HANDLING RULE 07</text>
    <text class="muted-text" x="6" y="41" font-size="7">ERP · CRM · Sheets · Ads</text>
    </g>
  </g>
  <g class="muted">
    <line class="hair" x1="60" y1="300" x2="60" y2="330" />
    <line class="hair" x1="600" y1="300" x2="600" y2="330" />
    <line class="thin" x1="60" y1="325" x2="600" y2="325" />
    <polygon points="66,322 66,328 60,325" fill="#6F6A60" />
    <polygon points="594,322 594,328 600,325" fill="#6F6A60" />
    <text class="muted-text" x="330.0" y="345" font-size="9" text-anchor="middle">5 SYSTEMS · 1 QUESTION</text>
  </g>
  <g class="muted">
    <line class="hair" x1="61.0" y1="100.0" x2="54" y2="100.0" />
    <line class="hair" x1="61.0" y1="230.0" x2="54" y2="230.0" />
    <line class="thin" x1="50" y1="100.0" x2="50" y2="230.0" />
    <polygon points="47,106.0 53,106.0 50,100.0" fill="#6F6A60" />
    <polygon points="47,224.0 53,224.0 50,230.0" fill="#6F6A60" />
    <g transform="translate(42, 165) rotate(-90)">
    <text class="muted-text" x="0" y="0" font-size="9" text-anchor="middle">4 TABLES → 1</text>
    </g>
  </g>
</svg>
