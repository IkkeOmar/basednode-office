<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Invoice workflow schematic: invoice received, extracted, posted">
  <style>
    .ink { stroke: #211F1B; }
    .muted { stroke: #6F6A60; }
    .accent { stroke: #F26B1F; }
    .thin { stroke-width: 0.75; }
    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
    .accent-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #A8410C; stroke: none; font-weight: 600; }
  </style>

  <!-- BLUEPRINT FRAME -->
  <rect class="ink thin" x="20" y="20" width="600" height="440" />

  <!-- CORNER TICK MARKS -->
  <g class="ink thin">
    <line x1="20" y1="40" x2="30" y2="40"/>
    <line x1="20" y1="60" x2="30" y2="60"/>
    <line x1="20" y1="80" x2="30" y2="80"/>
    <line x1="40" y1="20" x2="40" y2="30"/>
    <line x1="60" y1="20" x2="60" y2="30"/>
    <line x1="80" y1="20" x2="80" y2="30"/>
    <line x1="610" y1="40" x2="620" y2="40"/>
    <line x1="610" y1="60" x2="620" y2="60"/>
    <line x1="610" y1="80" x2="620" y2="80"/>
    <line x1="540" y1="20" x2="540" y2="30"/>
    <line x1="560" y1="20" x2="560" y2="30"/>
    <line x1="580" y1="20" x2="580" y2="30"/>
  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(420, 380)">
    <rect class="ink thin" x="0" y="0" width="180" height="60" />
    <line class="ink hair" x1="0" y1="20" x2="180" y2="20" />
    <line class="ink hair" x1="0" y1="40" x2="180" y2="40" />
    <line class="ink hair" x1="100" y1="0" x2="100" y2="60" />
    <text class="muted-text" x="6" y="14" font-size="9">FIG.</text>
    <text class="ink-text" x="106" y="14" font-size="10" font-weight="500">01 / 03</text>
    <text class="muted-text" x="6" y="34" font-size="9">DRAWN BY</text>
    <text class="ink-text" x="106" y="34" font-size="10">BASEDNODE</text>
    <text class="muted-text" x="6" y="54" font-size="9">SCALE</text>
    <text class="ink-text" x="106" y="54" font-size="10">1 : 4</text>
  </g>

  <!-- ══ STEP 1 — INVOICE RECEIVED (paper) ══ -->
  <g transform="translate(60, 80)">
    <rect class="ink" x="0" y="0" width="130" height="170" rx="2" />
    <line class="ink thin" x1="0" y1="30" x2="130" y2="30" />
    <text class="muted-text" x="10" y="20" font-size="8">FAKTURA</text>
    <text class="ink-text" x="120" y="20" font-size="8" text-anchor="end">NR. 4471</text>
    <line class="muted hair" x1="10" y1="48" x2="86" y2="48" />
    <line class="muted hair" x1="10" y1="62" x2="104" y2="62" />
    <line class="muted hair" x1="10" y1="76" x2="70" y2="76" />
    <line class="ink thin" x1="10" y1="96" x2="120" y2="96" />
    <line class="muted hair" x1="10" y1="112" x2="92" y2="112" />
    <line class="muted hair" x1="10" y1="126" x2="80" y2="126" />
    <text class="ink-text" x="120" y="150" font-size="10" text-anchor="end" font-weight="500">4.850,00</text>
    <text class="muted-text" x="120" y="162" font-size="7" text-anchor="end">DKK</text>
  </g>

  <!-- ══ CONNECTOR 1 — the single hairline + one accent node ══ -->
  <line class="ink thin" x1="196" y1="165" x2="268" y2="165" />
  <circle cx="232" cy="165" r="4" fill="#F26B1F" stroke="none" />

  <!-- ══ STEP 2 — EXTRACTED (data fields) ══ -->
  <g transform="translate(276, 108)">
    <rect class="ink thin" x="0" y="0" width="150" height="114" rx="2" />
    <text class="muted-text" x="10" y="18" font-size="8">UDTRUKKET</text>
    <line class="ink hair" x1="10" y1="26" x2="140" y2="26" />
    <text class="muted-text" x="10" y="42" font-size="8">Leverandør</text>
    <text class="ink-text" x="140" y="42" font-size="8" text-anchor="end">NORDKRAFT A/S</text>
    <text class="muted-text" x="10" y="60" font-size="8">Beløb</text>
    <text class="ink-text" x="140" y="60" font-size="8" text-anchor="end">4.850,00</text>
    <text class="muted-text" x="10" y="78" font-size="8">Moms</text>
    <text class="ink-text" x="140" y="78" font-size="8" text-anchor="end">970,00</text>
    <text class="muted-text" x="10" y="96" font-size="8">Konto</text>
    <text class="ink-text" x="140" y="96" font-size="8" text-anchor="end">5700</text>
  </g>

  <!-- ══ CONNECTOR 2 ══ -->
  <line class="ink thin" x1="432" y1="165" x2="504" y2="165" />
  <circle cx="468" cy="165" r="4" fill="#F26B1F" stroke="none" />

  <!-- ══ STEP 3 — POSTED (ledger rows) ══ -->
  <g transform="translate(512, 108)">
    <rect class="ink" x="0" y="0" width="88" height="114" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="88" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">BOGFØRT</text>
    <line class="muted hair" x1="8" y1="42" x2="80" y2="42" />
    <line class="muted hair" x1="8" y1="56" x2="80" y2="56" />
    <line class="muted hair" x1="8" y1="70" x2="62" y2="70" />
    <text class="ink-text" x="80" y="98" font-size="9" text-anchor="end" font-weight="500">OK</text>
  </g>

  <!-- ══ CALLOUT: the node, one accent line ══ -->
  <g>
    <line class="accent thin" x1="232" y1="165" x2="232" y2="248" />
    <circle class="accent" cx="232" cy="165" r="2.5" fill="#F26B1F" />
    <g transform="translate(160, 252)">
      <rect class="ink thin" x="0" y="0" width="150" height="46" fill="#F8F6F2" />
      <line class="ink hair" x1="0" y1="16" x2="150" y2="16" />
      <text class="muted-text" x="6" y="12" font-size="7">DETAIL · A</text>
      <text class="accent-text" x="6" y="30" font-size="8">HANDLINGSREGEL 04</text>
      <text class="muted-text" x="6" y="41" font-size="7">Konto 5700 · moms 25 %</text>
    </g>
  </g>

  <!-- ══ DIMENSION CALLOUT — time saved (left) ══ -->
  <g class="muted">
    <line class="hair" x1="60" y1="300" x2="60" y2="330" />
    <line class="hair" x1="600" y1="300" x2="600" y2="330" />
    <line class="thin" x1="60" y1="325" x2="600" y2="325" />
    <polygon points="66,322 66,328 60,325" fill="#6F6A60" />
    <polygon points="594,322 594,328 600,325" fill="#6F6A60" />
    <text class="muted-text" x="330" y="345" font-size="9" text-anchor="middle">3 HANDLINGER · 0 MINUTTERS</text>
  </g>

  <!-- ══ DIMENSION CALLOUT — volume (right, vertical) ══ -->
  <g class="muted">
    <line class="hair" x1="196" y1="80" x2="180" y2="80" />
    <line class="hair" x1="196" y1="250" x2="180" y2="250" />
    <line class="thin" x1="186" y1="80" x2="186" y2="250" />
    <polygon points="183,86 189,86 186,80" fill="#6F6A60" />
    <polygon points="183,244 189,244 186,250" fill="#6F6A60" />
    <g transform="translate(176, 165) rotate(-90)">
      <text class="muted-text" x="0" y="0" font-size="9" text-anchor="middle">4,5 MIN → 0</text>
    </g>
  </g>

  <!-- ══ STEP LABELS ══ -->
  <text class="ink-text" x="60" y="68" font-size="8">01 · MODTAGET</text>
  <text class="ink-text" x="276" y="96" font-size="8">02 · UDTRUKKET</text>
  <text class="ink-text" x="512" y="96" font-size="8">03 · BOGFØRT</text>

</svg>
