<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Schematic of a customer question arriving, being answered by the agent and closed in the ticketing system">
  <style>
    .ink { stroke: #211F1B; }
    .muted { stroke: #6F6A60; }
    .accent { stroke: #F26B1F; }
    .thin { stroke-width: 0.75; }
    .hair { stroke-width: 0.5; }
    .ink-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #211F1B; stroke: none; }
    .muted-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #6F6A60; stroke: none; }
    .accent-text { font-family: "Geist Mono", "IBM Plex Mono", monospace; fill: #A8410C; stroke: none; font-weight: 600; }
  </style>
  <!-- BLUEPRINT FRAME -->
    <rect class="ink thin" x="20" y="20" width="600" height="440" rx="0" />
  <!-- CORNER TICK MARKS -->
  <g class="ink thin">
    <line class="ink thin" x1="20" y1="40" x2="30" y2="40" />
    <line class="ink thin" x1="20" y1="60" x2="30" y2="60" />
    <line class="ink thin" x1="20" y1="80" x2="30" y2="80" />
    <line class="ink thin" x1="40" y1="20" x2="40" y2="30" />
    <line class="ink thin" x1="60" y1="20" x2="60" y2="30" />
    <line class="ink thin" x1="80" y1="20" x2="80" y2="30" />
    <line class="ink thin" x1="610" y1="40" x2="620" y2="40" />
    <line class="ink thin" x1="610" y1="60" x2="620" y2="60" />
    <line class="ink thin" x1="610" y1="80" x2="620" y2="80" />
    <line class="ink thin" x1="540" y1="20" x2="540" y2="30" />
    <line class="ink thin" x1="560" y1="20" x2="560" y2="30" />
    <line class="ink thin" x1="580" y1="20" x2="580" y2="30" />
  </g>
  <g transform="translate(420, 380)">
    <rect class="ink thin" x="0" y="0" width="180" height="60" rx="0" />
    <line class="ink hair" x1="0" y1="20" x2="180" y2="20" />
    <line class="ink hair" x1="0" y1="40" x2="180" y2="40" />
    <line class="ink hair" x1="100" y1="0" x2="100" y2="60" />
    <text class="muted-text" x="6" y="14" font-size="9">FIG.</text>
    <text class="ink-text" x="106" y="14" font-size="10" font-weight="500">02 / 03</text>
    <text class="muted-text" x="6" y="34" font-size="9">DRAWN BY</text>
    <text class="ink-text" x="106" y="34" font-size="10">BASEDNODE</text>
    <text class="muted-text" x="6" y="54" font-size="9">SCALE</text>
    <text class="ink-text" x="106" y="54" font-size="10">1 : 4</text>
  </g>
  <!-- STEP 1 -->
  <g transform="translate(69.0, 105.0)">
    <rect class="ink" x="0" y="0" width="112" height="120" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="112" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">QUESTION</text>
    <text class="accent-text" x="104" y="18" font-size="8" text-anchor="end">RETURN?</text>
    <line class="muted hair" x1="8" y1="44" x2="104" y2="44" />
    <line class="muted hair" x1="8" y1="58" x2="86" y2="58" />
    <line class="muted hair" x1="8" y1="72" x2="104" y2="72" />
    <line class="muted hair" x1="8" y1="86" x2="86" y2="86" />
    <line class="accent thin" x1="8" y1="94" x2="82" y2="94" />
  </g>
  <!-- STEP 2 -->
  <g transform="translate(267.0, 105.0)">
    <rect class="ink thin" x="0" y="0" width="138" height="120" rx="2" />
    <text class="muted-text" x="10" y="18" font-size="8">ANSWER</text>
    <line class="ink hair" x1="10" y1="26" x2="128" y2="26" />
    <text class="muted-text" x="10" y="42" font-size="8">Order</text>
    <text class="ink-text" x="128" y="42" font-size="8" text-anchor="end">#81204</text>
    <text class="muted-text" x="10" y="60" font-size="8">Order date</text>
    <text class="ink-text" x="128" y="60" font-size="8" text-anchor="end">14 Oct</text>
    <text class="muted-text" x="10" y="78" font-size="8">Delivered</text>
    <text class="ink-text" x="128" y="78" font-size="8" text-anchor="end">Yes</text>
    <text class="muted-text" x="10" y="96" font-size="8">Reply</text>
    <text class="ink-text" x="128" y="96" font-size="8" text-anchor="end">3 lines</text>
  </g>
  <!-- STEP 3 -->
  <g transform="translate(491.0, 105.0)">
    <rect class="ink" x="0" y="0" width="100" height="120" rx="2" />
    <line class="ink thin" x1="0" y1="26" x2="100" y2="26" />
    <text class="muted-text" x="8" y="18" font-size="7">CLOSED</text>
    <line class="muted hair" x1="8" y1="42" x2="92" y2="42" />
    <line class="muted hair" x1="8" y1="56" x2="92" y2="56" />
    <line class="muted hair" x1="8" y1="70" x2="92" y2="70" />
    <text class="ink-text" x="92" y="104" font-size="9" text-anchor="end" font-weight="500">AUTO</text>
  </g>
  <!-- CONNECTOR 1 -->
    <line class="ink thin" x1="187.0" y1="165" x2="259.0" y2="165" />
    <circle cx="223.0" cy="165" r="4" fill="#F26B1F" stroke="none" />
  <!-- CONNECTOR 2 -->
    <line class="ink thin" x1="411.0" y1="165" x2="483.0" y2="165" />
    <circle cx="447.0" cy="165" r="4" fill="#F26B1F" stroke="none" />
    <text class="ink-text" x="69.0" y="93.0" font-size="8">01 · ARRIVES</text>
    <text class="ink-text" x="267.0" y="93.0" font-size="8">02 · ANSWERED</text>
    <text class="ink-text" x="491.0" y="93.0" font-size="8">03 · CLOSED</text>
  <!-- CALLOUT -->
  <g>
    <line class="accent thin" x1="223.0" y1="165" x2="223.0" y2="248" />
    <circle class="accent" cx="223.0" cy="165" r="2.5" fill="#F26B1F" />
    <g transform="translate(160, 252)">
    <rect class="ink thin" x="0" y="0" width="150" height="46" rx="0" />
    <line class="ink hair" x1="0" y1="16" x2="150" y2="16" />
    <text class="muted-text" x="6" y="12" font-size="7">DETAIL · B</text>
    <text class="accent-text" x="6" y="30" font-size="8">HANDLING RULE 11</text>
    <text class="muted-text" x="6" y="41" font-size="7">Order data · returns · delivery</text>
    </g>
  </g>
  <g class="muted">
    <line class="hair" x1="60" y1="300" x2="60" y2="330" />
    <line class="hair" x1="600" y1="300" x2="600" y2="330" />
    <line class="thin" x1="60" y1="325" x2="600" y2="325" />
    <polygon points="66,322 66,328 60,325" fill="#6F6A60" />
    <polygon points="594,322 594,328 600,325" fill="#6F6A60" />
    <text class="muted-text" x="330.0" y="345" font-size="9" text-anchor="middle">2 500 CASES · 85 % NO HUMAN</text>
  </g>
  <g class="muted">
    <line class="hair" x1="69.0" y1="105.0" x2="54" y2="105.0" />
    <line class="hair" x1="69.0" y1="225.0" x2="54" y2="225.0" />
    <line class="thin" x1="50" y1="105.0" x2="50" y2="225.0" />
    <polygon points="47,111.0 53,111.0 50,105.0" fill="#6F6A60" />
    <polygon points="47,219.0 53,219.0 50,225.0" fill="#6F6A60" />
    <g transform="translate(42, 165) rotate(-90)">
    <text class="muted-text" x="0" y="0" font-size="9" text-anchor="middle">4 MIN → 12 SEC</text>
    </g>
  </g>
</svg>
